  /* =======================================================
     INTRO SEQUENCE
     Inspired by the reference:
     diagonal micro-thumbnails → dot → horizontal line →
     diagonal → resolve into the real photography page.

  body {
    overflow-x: hidden;
  }

  .intro-sequence {
    position: fixed;
    inset: 0;
    z-index: 500;
    pointer-events: none;
    background: var(--bg);
    overflow: hidden;
    animation: introBackground 2700ms cubic-bezier(.65,0,.35,1) forwards;
  }

  .intro-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(72vw, 980px);
    height: min(48vh, 520px);
    transform: translate(-50%, -50%);
  }

  .intro-thumb {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 64px;
    height: 46px;
    object-fit: cover;
    transform-origin: center;
    box-shadow: none;
    animation-duration: 2700ms;
    animation-timing-function: cubic-bezier(.65,0,.35,1);
    animation-fill-mode: forwards;
  }

  /* Individual offsets make the micro-chain feel photographic rather than UI-like */
  .intro-thumb:nth-child(1) { --dx:-150px; --dy: 105px; --r:-28deg; --line:-180px; animation-name:introThumb1; }
  .intro-thumb:nth-child(2) { --dx:-100px; --dy: 70px;  --r:-20deg; --line:-120px; animation-name:introThumb2; }
  .intro-thumb:nth-child(3) { --dx:-50px;  --dy: 35px;  --r:-12deg; --line:-60px;  animation-name:introThumb3; }
  .intro-thumb:nth-child(4) { --dx:0px;    --dy: 0px;   --r:0deg;   --line:0px;    animation-name:introThumb4; }
  .intro-thumb:nth-child(5) { --dx:50px;   --dy:-35px;  --r:12deg;  --line:60px;   animation-name:introThumb5; }
  .intro-thumb:nth-child(6) { --dx:100px;  --dy:-70px;  --r:20deg;  --line:120px;  animation-name:introThumb6; }
  .intro-thumb:nth-child(7) { --dx:150px;  --dy:-105px; --r:28deg;  --line:180px;  animation-name:introThumb7; }

const preferredOrder = [
  'Arles, France',
  'Accra, Ghana',
  'Paris, France',
  'London, England',
  'Lisbon, Portugal',
  'Mexico City, Mexico',
  'Copper Canyon, Mexico'
];

const displayName = city => city.split(',')[0].toUpperCase();
const slug = city => city.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

const groups = preferredOrder
  .map(city => ({ city, photos: photos.filter(p => p.city === city) }))
  .filter(group => group.photos.length);

const indexEl = document.getElementById('index');
const mainEl = document.getElementById('main');
const counterEl = document.getElementById('counter');

let activeGroup = 0;
let openPhotoIndex = 0;

function renderIndex() {
  indexEl.innerHTML = groups.map((group, i) => `
    <button class="place-link ${i === 0 ? 'active' : ''}" data-group="${i}" type="button">
      <span class="place-number">${String(i + 1).padStart(2,'0')}</span>
      <span class="place-name">${displayName(group.city)}</span>
      <span class="place-count">${String(group.photos.length).padStart(2,'0')}</span>
    </button>
  `).join('');

  indexEl.querySelectorAll('.place-link').forEach(button => {
    button.addEventListener('click', () => {
      const i = Number(button.dataset.group);
      document.getElementById(slug(groups[i].city)).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function renderMain() {
  let globalIndex = 0;
  mainEl.innerHTML = groups.map((group, groupIndex) => {
    const sectionPhotos = group.photos.map((photo, localIndex) => {
      const thisGlobalIndex = photos.indexOf(photo);
      const layout = localIndex % 10;
      const html = `
        <figure class="photo layout-${layout}">
          <button type="button" class="open-photo" data-photo-index="${thisGlobalIndex}" aria-label="Open photograph ${thisGlobalIndex + 1}">
            <img src="${photo.src}" alt="${group.city}, photograph ${localIndex + 1}" loading="lazy" data-filename="${photo.src.split('/').pop()}">
          </button>
          <figcaption>
            <span>${String(localIndex + 1).padStart(2,'0')}</span>
            <span>${displayName(group.city)}</span>
          </figcaption>
        </figure>`;
      globalIndex++;
      return html;
    }).join('');

    return `
      <section class="place-section" id="${slug(group.city)}" data-group="${groupIndex}">
        <div class="section-label">
          <span>${String(groupIndex + 1).padStart(2,'0')}</span>
          <span>${displayName(group.city)}</span>
        </div>
        <div class="photo-field">${sectionPhotos}</div>
      </section>`;
  }).join('');

  mainEl.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => {
      const filename = img.dataset.filename || 'image';
      const replacement = document.createElement('div');
      replacement.className = 'broken';
      replacement.textContent = `IMAGE NOT FOUND\n${filename}`;
      img.replaceWith(replacement);
    }, { once: true });
  });

  mainEl.querySelectorAll('.open-photo').forEach(button => {
    button.addEventListener('click', () => openLightbox(Number(button.dataset.photoIndex)));
  });
}

function setActiveGroup(i) {
  if (i === activeGroup) return;
  activeGroup = i;
  indexEl.querySelectorAll('.place-link').forEach((el, idx) => el.classList.toggle('active', idx === i));
  counterEl.textContent = `${String(i + 1).padStart(2,'0')} / ${String(groups.length).padStart(2,'0')}`;

  const activeButton = indexEl.querySelector(`[data-group="${i}"]`);
  if (window.innerWidth <= 900 && activeButton) {
    activeButton.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
}

function setupSectionObserver() {
  const observer = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (visible) setActiveGroup(Number(visible.target.dataset.group));
  }, {
    threshold: [0.15, 0.3, 0.5, 0.7],
    rootMargin: '-12% 0px -55% 0px'
  });

  document.querySelectorAll('.place-section').forEach(section => observer.observe(section));
}

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const lightboxMeta = document.getElementById('lightboxMeta');

function openLightbox(index) {
  openPhotoIndex = index;
  const photo = photos[index];
  if (!photo) return;
  lightboxImage.src = photo.src;
  lightboxImage.alt = photo.city;
  lightboxMeta.textContent = `${displayName(photo.city)} / ${String(index + 1).padStart(2,'0')} OF ${String(photos.length).padStart(2,'0')}`;
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function stepLightbox(direction) {
  openPhotoIndex = (openPhotoIndex + direction + photos.length) % photos.length;
  openLightbox(openPhotoIndex);
}

document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
document.getElementById('prevPhoto').addEventListener('click', () => stepLightbox(-1));
document.getElementById('nextPhoto').addEventListener('click', () => stepLightbox(1));
lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', event => {
  if (!lightbox.classList.contains('open')) return;
  if (event.key === 'Escape') closeLightbox();
  if (event.key === 'ArrowLeft') stepLightbox(-1);
  if (event.key === 'ArrowRight') stepLightbox(1);
});


const darkroomToggle = document.getElementById('darkroomToggle');

function setDarkroom(isDark, persist = true) {
  document.documentElement.classList.toggle('darkroom', isDark);
  document.body.classList.toggle('darkroom', isDark);

  darkroomToggle.setAttribute('aria-pressed', String(isDark));
  darkroomToggle.textContent = isDark ? 'LIGHTROOM' : 'DARKROOM';

  if (persist) {
    try {
      localStorage.setItem(
        'sophia-photography-theme',
        isDark ? 'darkroom' : 'light'
      );
    } catch (e) {}
  }
}

/* Sync the toggle with the theme that was applied before first paint. */
setDarkroom(
  document.documentElement.classList.contains('darkroom'),
  false
);

darkroomToggle.addEventListener('click', () => {
  setDarkroom(!document.documentElement.classList.contains('darkroom'));
});

const introSequence = document.getElementById('introSequence');
if (introSequence) {
  introSequence.addEventListener('animationend', event => {
    if (event.animationName === 'introBackground') {
      introSequence.remove();
    }
  });
}

renderIndex();
renderMain();
setupSectionObserver();
</script>
