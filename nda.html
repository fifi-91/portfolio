<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Protected Project — Sophia Akrofi</title>

  <link rel="stylesheet" href="styles.css"/>
</head>

<body data-screen-label="Password Protected Project">

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">Sophia Akrofi</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
    </div>

    <div class="nav-mobile">
      <div id="menuToggle">
        <img src="./images/menu.svg" alt="Menu">
      </div>
    </div>
  </div>
</nav>

<main class="password-page">
  <section class="password-overlay">
    <div class="password-container">

      <div class="password-kicker">
        <span class="password-dot"></span>
        Selected work
      </div>

      <h1>Password protected project</h1>

      <p class="password-intro">
        This case study is private. Enter the password to continue.
      </p>

      <div class="password-row">
        <input 
          type="password" 
          id="password-input" 
          placeholder="Enter password"
          autocomplete="current-password"
        />

        <button id="submit-btn" disabled>Enter</button>
      </div>

      <p id="error-message" class="error-message"></p>

      <a class="password-link" href="mailto:hello@sophiaakrofi.com">
        Request access →
      </a>

    </div>
  </section>
</main>

<script>
  const correctPassword = "agileakrofi21";

  const params = new URLSearchParams(window.location.search);
  const project = params.get("project");

  const input = document.getElementById("password-input");
  const button = document.getElementById("submit-btn");
  const error = document.getElementById("error-message");

  input.addEventListener("input", () => {
    button.disabled = input.value.length === 0;
    error.textContent = "";
  });

  button.addEventListener("click", () => {
    if (input.value === correctPassword) {
      if (project === "luna") {
        window.location.href = "luna.html";
      } else if (project === "accru") {
        window.location.href = "accru.html";
      } else {
        window.location.href = "saudi.html";
      }
    } else {
      error.textContent = "Incorrect password";
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && input.value.length > 0) {
      button.click();
    }
  });
</script>

</body>
</html>
